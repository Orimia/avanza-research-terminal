# Streamlit base theme — light "research terminal" palette.
# (Comprehensive CSS in src/dashboard/ui.py:inject_css layers on top of this.)
[theme]
base = "light"
primaryColor = "#0066cc"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
